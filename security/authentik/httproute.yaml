apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  parentRefs:
    - name: aegis
      namespace: gateway
  hostnames:
    - auth.aegis.test
  rules:
    - backendRefs:
        # Service port 80 -> container 9000.
        - name: authentik-server
          port: 80
