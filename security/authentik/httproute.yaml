apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  parentRefs:
    - name: aegis
      namespace: gateway
      # Pinned to the HTTPS listener. Without sectionName this route
      # would also attach to the HTTP listener and compete with the
      # redirect route that now owns port 80.
      sectionName: https-auth
  hostnames:
    - auth.aegis.test
  rules:
    - backendRefs:
        # Service port 80 -> container 9000.
        - name: authentik-server
          port: 80
