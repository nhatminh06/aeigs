apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  chart:
    spec:
      chart: authentik
      version: "2026.5.6"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  values:
    global:
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-config
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-config
              key: postgresql-password
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-config
              key: bootstrap-password
        - name: AUTHENTIK_BOOTSTRAP_TOKEN
          valueFrom:
            secretKeyRef:
              name: authentik-config
              key: bootstrap-token
        - name: AUTHENTIK_BOOTSTRAP_EMAIL
          value: akadmin@aegis.local
    # Self-contained Postgres for this dev cluster — not a persistent
    # datastore. If Authentik data needs to survive cluster rebuilds,
    # that's a disaster-recovery-phase problem, not solved here.
    postgresql:
      enabled: true
      # The Bitnami chart ships its own NetworkPolicy that allows ingress
      # to 5432 from any source. NetworkPolicies are additive, so leaving
      # it enabled unions with networkpolicy.yaml and silently cancels the
      # restriction out — verified: an unrelated demo-app pod still
      # reached 5432 with both policies present. Disabled so the policy in
      # this directory is the only one selecting these pods.
      networkPolicy:
        enabled: false
      auth:
        existingSecret: authentik-config
        secretKeys:
          userPasswordKey: postgresql-password
      primary:
        persistence:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
    server:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    worker:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        # 256Mi OOMKilled the worker in practice (observed on dev-kind
        # after this HelmRelease first went live) — it's the same Django
        # app as the server process, running background tasks/blueprint
        # application, not a lighter process. Matched to server's limit.
        limits:
          cpu: 500m
          memory: 512Mi
    blueprints:
      secrets:
        - authentik-blueprints
