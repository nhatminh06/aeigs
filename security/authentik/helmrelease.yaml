apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  chart:
    spec:
      chart: authentik
      version: "2026.8.0"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  values:
    global:
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-config
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-config
              key: postgresql-password
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-config
              key: bootstrap-password
        - name: AUTHENTIK_BOOTSTRAP_TOKEN
          valueFrom:
            secretKeyRef:
              name: authentik-config
              key: bootstrap-token
        - name: AUTHENTIK_BOOTSTRAP_EMAIL
          value: akadmin@aegis.local
    # Self-contained Postgres for this dev cluster — not a persistent
    # datastore. If Authentik data needs to survive cluster rebuilds,
    # that's a disaster-recovery-phase problem, not solved here.
    postgresql:
      enabled: true
      auth:
        existingSecret: authentik-config
        secretKeys:
          userPasswordKey: postgresql-password
      primary:
        # The Bitnami chart ships its own NetworkPolicy allowing ingress to
        # 5432 from any source. NetworkPolicies are additive, so leaving it
        # enabled unions with networkpolicy-postgresql.yaml and silently
        # cancels the restriction out — an unrelated demo-app pod still
        # reached 5432 with both present.
        #
        # This key must stay under `primary`. The chart's template tests
        # `.Values.primary.networkPolicy.enabled`, so the same setting one
        # level up is an unknown value that Helm accepts and ignores: it
        # appears in `helm get values` and does nothing. That is how it was
        # first written here, and the boundary looked correct only because
        # the rendered policy had been deleted by hand — the next chart
        # upgrade brought it straight back.
        networkPolicy:
          enabled: false
        persistence:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
    server:
      resources:
        requests:
          cpu: 100m
          # Measured, not guessed: a freshly started server sits at ~394Mi
          # and its cAdvisor working set runs ~420-440Mi, so the previous
          # 256Mi request advertised roughly half of what this container
          # actually holds. 512Mi reserves what it really uses.
          memory: 512Mi
        limits:
          cpu: 500m
          # 512Mi OOMKilled the server twice (exit 137), the second time
          # reproduced on demand with 200 requests at concurrency 8. Read
          # from the container's own cgroup rather than sampled metrics,
          # because Prometheus scrapes cAdvisor every 30s and missed the
          # transient peak entirely — it reported 439Mi for a container
          # that had already breached 512Mi:
          #
          #   memory.peak    = 561459200  (535Mi) under that load
          #   memory.current =  ~532Mi    settled afterwards, flat
          #
          # So the old limit sat below both the peak and the post-traffic
          # resting level. 768Mi clears the measured peak by ~43% and is
          # ~10% of this node's 7.75Gi. Memory plateaus rather than
          # climbing, so this is headroom for a tight limit, not a larger
          # limit hiding a leak.
          memory: 768Mi
    worker:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        # 256Mi OOMKilled the worker in practice (observed on dev-kind
        # after this HelmRelease first went live) — it's the same Django
        # app as the server process, running background tasks/blueprint
        # application, not a lighter process. Matched to server's limit.
        limits:
          cpu: 500m
          memory: 512Mi
    blueprints:
      secrets:
        - authentik-blueprints
