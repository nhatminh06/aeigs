apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-postgresql-ingress
  namespace: authentik
spec:
  # Selects the Postgres pod only. These are the StatefulSet's own
  # selector.matchLabels, so they survive restarts and chart upgrades —
  # unlike the pod name authentik-postgresql-0, which a rescheduled or
  # renamed workload would break.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: authentik
      app.kubernetes.io/component: primary
  # Ingress only. Egress is deliberately not restricted here: the traffic
  # inventory does not yet cover everything Postgres and the rest of the
  # namespace send outbound, and an incomplete egress rule breaks DNS
  # before it protects anything.
  policyTypes:
    - Ingress
  ingress:
    # Server and worker are listed separately rather than matched by the
    # shared app.kubernetes.io/name=authentik label. That broader label
    # would also admit any future Authentik component the chart adds,
    # granting database access by default. Naming the two components that
    # actually need it keeps new components denied until reviewed.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/instance: authentik
              app.kubernetes.io/component: server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/instance: authentik
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 5432
