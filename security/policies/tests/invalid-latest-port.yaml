apiVersion: v1
kind: Pod
metadata:
  name: test-registry-port-no-tag
  namespace: default
spec:
  containers:
    - name: test
      # No tag — the colon here is a registry port, not a tag separator.
      # A raw-string match like "*:*" would wrongly treat this as tagged.
      image: registry.example.com:5000/app
