apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      # kube-proxy in kube-system legitimately runs privileged+hostNetwork.
      # Without this exclusion, the next time it (or anything else in
      # these namespaces) gets recreated — a node restart, a DaemonSet
      # rollout — Kyverno blocks it and breaks core cluster networking.
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
      validate:
        message: >-
          Privileged containers are not allowed. Set
          securityContext.privileged to false (or omit it) on every
          container.
        pattern:
          spec:
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): "false"
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
