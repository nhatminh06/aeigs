apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      # System components in these namespaces are managed by kind/kubeadm,
      # not this repo — excluding them keeps this policy scoped to
      # workloads we actually control.
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
      validate:
        message: "An image tag is required (an untagged image defaults to :latest)."
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      # System components in these namespaces are managed by kind/kubeadm,
      # not this repo — excluding them keeps this policy scoped to
      # workloads we actually control.
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
      validate:
        message: "Using the 'latest' image tag is not allowed; pin to a specific version."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
