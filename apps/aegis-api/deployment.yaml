apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-api
  namespace: aegis-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-api
  template:
    metadata:
      labels:
        app: aegis-api
    spec:
      # No Kubernetes API access needed, so no token to steal if the pod
      # is compromised.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Matches the uid the Dockerfile sets explicitly (USER 65532:65532
        # on distroless:nonroot) — required because that image's USER is
        # numeric already, unlike podinfo's, but stated here regardless so
        # the manifest doesn't depend on the image getting this right.
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aegis-api
          # github.com/nhatminh06/aegis-api v0.1.2, multi-platform
          # (linux/amd64, linux/arm64). Pull resolution is strictly by
          # digest regardless of the tag alongside it — the tag is what
          # lets Renovate track updates at all: given only a bare digest
          # with no tag, it has no version lineage to check against and
          # fails with "Could not determine new digest for update" (see
          # bootstrap/kind/cluster.yaml for the same tag@digest pattern).
          # This is still exactly what CLAUDE.md's "prefer digests where
          # it matters" asks for. This digest passed a
          # Trivy scan on both platforms and carries a Cosign keyless
          # signature from this repository's release workflow — see
          # security/policies/verify-aegis-api-image.yaml, which requires
          # exactly that before admitting it.
          #
          # v0.1.1 (superseded, still published, never moved) was signed
          # with Cosign v3, which writes a signature format this cluster's
          # Kyverno version cannot verify for a keyless attestor — a real
          # gap found by testing admission against it live, not assumed.
          # v0.1.2 is the same pipeline with Cosign pinned to v2.6.5.
          image: ghcr.io/nhatminh06/aegis-api:v0.1.3@sha256:b0845756fb57e3e37083da69b181df5dd89eca804c48dcd016e3c1a8df54ab4c # {"$imagepolicy": "aegis-api:aegis-api"}
          ports:
            - name: http
              containerPort: 8080
          # Separate signals on purpose: liveness must not fail merely
          # because the pod hasn't finished its startup warm-up.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # Measured locally, not copied: docker stats showed ~1.8MiB
            # idle and ~3MiB under 200 concurrent /api/v1/work requests —
            # this is a small static Go binary with no dependency to wait
            # on. Requests give it real scheduler representation rather
            # than an arbitrarily tiny number; limits leave wide headroom
            # (>20x observed) while still being a small fraction of the
            # node's 7.75Gi.
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
