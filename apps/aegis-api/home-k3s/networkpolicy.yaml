# Evidence-based, not copied from dev-kind: verified live that an
# unrelated pod could reach aegis-api's Service before this policy
# existed, and that the permanent ingress reaches aegis-api under an
# ordinary workload identity (3285, not a reserved Cilium entity) — so
# a portable NetworkPolicy is sufficient here; no CiliumNetworkPolicy
# exception is needed the way dev-kind's Gateway required one.
# Prometheus (app.kubernetes.io/name: prometheus, observed live from
# its actual pod labels once deployed) is the second allowed source.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis-api-ingress
  namespace: aegis-api
spec:
  podSelector:
    matchLabels:
      app: aegis-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
          podSelector:
            matchLabels:
              app: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
