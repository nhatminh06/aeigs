apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aegis-api
  namespace: aegis-api
spec:
  parentRefs:
    - name: aegis
      namespace: gateway
      sectionName: https-api
  hostnames:
    - api.aegis.test
  rules:
    - backendRefs:
        - name: aegis-api
          port: 80
