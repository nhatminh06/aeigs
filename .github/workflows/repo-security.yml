name: repo-security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHA, not the mutable v7.0.1 tag — a tag can be
      # moved; a SHA can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan for committed secrets
        run: ./gitleaks detect --source . --redact --exit-code 1

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Kubernetes manifests for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml

  kyverno-policy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kyverno CLI
        run: |
          curl -sSL -o kyverno-cli.tar.gz \
            https://github.com/kyverno/kyverno/releases/download/v1.18.2/kyverno-cli_v1.18.2_linux_x86_64.tar.gz
          echo "cb2feb8356149fd2fe774c894ccf0969f4a60a83867dd913af724f74ffbbc18b  kyverno-cli.tar.gz" | sha256sum -c -
          tar -xzf kyverno-cli.tar.gz kyverno
      # Static rule-logic check only — evaluates each fixture as a single
      # object, not as CREATE/UPDATE/DELETE requests compared against
      # prior state. See security/policies/tests/README.md for why the
      # live kubectl-debug/kubectl-apply procedure there is still required
      # and not replaced by this.
      - name: Run kyverno test
        run: ./kyverno test security/policies/tests

  kustomize-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned + checksum-verified rather than using the runner's
      # preinstalled kubectl, whose version isn't ours to control —
      # matching what this repo already does for the gitleaks and kyverno
      # binaries. Version tracks the cluster's Kubernetes baseline, since
      # `kubectl kustomize` embeds the kustomize version tied to that
      # release.
      - name: Install kubectl
        run: |
          curl -sSL -o kubectl \
            https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
          echo "629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7  kubectl" | sha256sum -c -
          chmod +x kubectl
      # Catches a broken GitOps composition (missing resource, bad path,
      # malformed kustomization) before Flux would fail to apply it in
      # cluster. This builds the manifests only — it does not validate
      # them against a live API server.
      - name: Build dev-kind manifests
        run: ./kubectl kustomize clusters/dev-kind > /dev/null
