name: repo-security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHA, not the mutable v7.0.1 tag — a tag can be
      # moved; a SHA can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan for committed secrets
        run: ./gitleaks detect --source . --redact --exit-code 1

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Kubernetes manifests for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml

  kyverno-policy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kyverno CLI
        run: |
          curl -sSL -o kyverno-cli.tar.gz \
            https://github.com/kyverno/kyverno/releases/download/v1.18.2/kyverno-cli_v1.18.2_linux_x86_64.tar.gz
          echo "cb2feb8356149fd2fe774c894ccf0969f4a60a83867dd913af724f74ffbbc18b  kyverno-cli.tar.gz" | sha256sum -c -
          tar -xzf kyverno-cli.tar.gz kyverno
      # Static rule-logic check only — evaluates each fixture as a single
      # object, not as CREATE/UPDATE/DELETE requests compared against
      # prior state. See security/policies/tests/README.md for why the
      # live kubectl-debug/kubectl-apply procedure there is still required
      # and not replaced by this.
      - name: Run kyverno test
        run: ./kyverno test security/policies/tests

  kustomize-build:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: 0.8.0
      FLUX_VERSION: 2.9.4
      KUBERNETES_SCHEMA_COMMIT: a6f9a32d2ccb64b6e4f5b41419b9c2e8ee0cce18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned + checksum-verified rather than using the runner's
      # preinstalled kubectl, whose version isn't ours to control —
      # matching what this repo already does for the gitleaks and kyverno
      # binaries. Version tracks the cluster's Kubernetes baseline, since
      # `kubectl kustomize` embeds the kustomize version tied to that
      # release.
      - name: Install kubectl
        run: |
          curl -sSL -o kubectl \
            https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
          echo "629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7  kubectl" | sha256sum -c -
          chmod +x kubectl
      - name: Install kubeconform and Flux schemas
        run: |
          curl -sSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform

          curl -sSL -o flux-crd-schemas.tar.gz \
            "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/crd-schemas.tar.gz"
          echo "a69559b63275a1883696548e286aec7ae937ee0bdb86758900bbc20512dac37e  flux-crd-schemas.tar.gz" | sha256sum -c -
          mkdir flux-crd-schemas
          tar -xzf flux-crd-schemas.tar.gz -C flux-crd-schemas
      # Catches a broken GitOps composition (missing resource, bad path,
      # malformed kustomization) before Flux would fail to apply it in
      # cluster. This builds the manifests only — it does not validate
      # them against a live API server.
      - name: Build dev-kind manifests
        run: ./kubectl kustomize clusters/dev-kind > /dev/null
      - name: Build home-k3s manifests
        run: ./kubectl kustomize clusters/home-k3s > /dev/null
      # This validates rendered resources against pinned Kubernetes and Flux
      # schemas; it is not live API-server validation. kubeconform's Kubernetes
      # catalog has no schema for CRD definition objects, so only that exact
      # kind is skipped. Flux custom resources are still validated against the
      # official schemas from the pinned Flux release. Any other missing schema
      # or schema violation fails the job.
      - name: Validate dev-kind manifest schemas
        run: |
          ./kubectl kustomize clusters/dev-kind | ./kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.36.0 \
            -schema-location "https://raw.githubusercontent.com/yannh/kubernetes-json-schema/${KUBERNETES_SCHEMA_COMMIT}/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json" \
            -schema-location "file://${PWD}/flux-crd-schemas/{{.ResourceKind}}{{.KindSuffix}}.json" \
            -skip CustomResourceDefinition \
            -
      - name: Validate home-k3s manifest schemas
        run: |
          ./kubectl kustomize clusters/home-k3s | ./kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.36.0 \
            -schema-location "https://raw.githubusercontent.com/yannh/kubernetes-json-schema/${KUBERNETES_SCHEMA_COMMIT}/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json" \
            -schema-location "file://${PWD}/flux-crd-schemas/{{.ResourceKind}}{{.KindSuffix}}.json" \
            -skip CustomResourceDefinition \
            -

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck ships preinstalled on ubuntu-latest runners — no
      # separate install/pin step needed. Several of these scripts are
      # destructive-capable (backup/restore/prune) and load-bearing for
      # the platform's recovery story, so static shell analysis is worth
      # running on every push, not just ad hoc.
      - name: shellcheck all scripts
        run: shellcheck scripts/*.sh

  renovate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A malformed renovate.json doesn't fail loudly — Renovate just stops
      # picking up updates, so the pins quietly go stale with no signal.
      # Pinned by digest as well as version: the validator's own accepted
      # options change between releases (an older validator rejected
      # managerFilePatterns, which current Renovate requires), so an
      # unpinned image would make this check disagree with the Renovate
      # that actually runs against the repo.
      - name: Validate renovate.json
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work \
            ghcr.io/renovatebot/renovate:44.30.3@sha256:d3d60a87bab73203327dd664f94f11e83091441ee4964c920662d83023446395 \
            renovate-config-validator
