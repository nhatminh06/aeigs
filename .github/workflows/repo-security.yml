name: repo-security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Renovate updates the version only. The unchanged checksum makes CI
      # fail until a reviewer verifies and records the new published SHA-256.
      GITLEAKS_VERSION: 8.30.1
    steps:
      # Pinned to commit SHA, not the mutable v7.0.1 tag — a tag can be
      # moved; a SHA can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan for committed secrets
        run: GITLEAKS_BIN=./gitleaks ./scripts/verify-repo.sh gitleaks

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Kubernetes manifests for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml

  kyverno-policy-test:
    runs-on: ubuntu-latest
    env:
      # Renovate updates the version only. The unchanged checksum makes CI
      # fail until a reviewer verifies and records the new published SHA-256.
      KYVERNO_CLI_VERSION: 1.19.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kyverno CLI
        run: |
          curl -sSL -o kyverno-cli.tar.gz \
            "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_CLI_VERSION}/kyverno-cli_v${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz"
          echo "b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae  kyverno-cli.tar.gz" | sha256sum -c -
          tar -xzf kyverno-cli.tar.gz kyverno
      # Static rule-logic check only — evaluates each fixture as a single
      # object, not as CREATE/UPDATE/DELETE requests compared against
      # prior state. See security/policies/tests/README.md for why the
      # live kubectl-debug/kubectl-apply procedure there is still required
      # and not replaced by this.
      - name: Run kyverno test
        run: KYVERNO_BIN=./kyverno ./scripts/verify-repo.sh kyverno

  kustomize-build:
    runs-on: ubuntu-latest
    env:
      # Renovate updates CLI versions only. Their unchanged checksums make CI
      # fail until a reviewer verifies and records each new published SHA-256.
      KUBECTL_VERSION: 1.36.5
      KUBECONFORM_VERSION: 0.8.0
      FLUX_VERSION: 2.9.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned + checksum-verified rather than using the runner's
      # preinstalled kubectl, whose version isn't ours to control —
      # matching what this repo already does for the gitleaks and kyverno
      # binaries. Version tracks the cluster's Kubernetes baseline, since
      # `kubectl kustomize` embeds the kustomize version tied to that
      # release.
      - name: Install kubectl
        run: |
          curl -sSL -o kubectl \
            "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "33bc88a24c3b09cf55bfd59e6ca977881b61fc3f25ab65bc80c65b430248648e  kubectl" | sha256sum -c -
          chmod +x kubectl
      - name: Install kubeconform and Flux schemas
        run: |
          curl -sSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform

          curl -sSL -o flux-crd-schemas.tar.gz \
            "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/crd-schemas.tar.gz"
          echo "3c6c976df251e5a7e8c1c6a0ee63e6c28026d568b14ffa2f13cc32a6a564f238  flux-crd-schemas.tar.gz" | sha256sum -c -
          mkdir flux-crd-schemas
          tar -xzf flux-crd-schemas.tar.gz -C flux-crd-schemas
      # The shared verifier renders each environment once and feeds those
      # files to strict kubeconform validation. It never contacts a cluster.
      - name: Build and validate dev-kind and home-k3s manifests
        run: |
          KUBECTL_BIN=./kubectl \
          KUBECONFORM_BIN=./kubeconform \
          FLUX_SCHEMA_DIR="$PWD/flux-crd-schemas" \
            ./scripts/verify-repo.sh manifests

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck ships preinstalled on ubuntu-latest runners — no
      # separate install/pin step needed. Several of these scripts are
      # destructive-capable (backup/restore/prune) and load-bearing for
      # the platform's recovery story, so static shell analysis is worth
      # running on every push, not just ad hoc.
      - name: shellcheck all scripts
        run: ./scripts/verify-repo.sh shellcheck

  renovate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A malformed renovate.json doesn't fail loudly — Renovate just stops
      # picking up updates, so the pins quietly go stale with no signal.
      # Pinned by digest as well as version: the validator's own accepted
      # options change between releases (an older validator rejected
      # managerFilePatterns, which current Renovate requires), so an
      # unpinned image would make this check disagree with the Renovate
      # that actually runs against the repo.
      - name: Validate renovate.json
        run: ./scripts/verify-repo.sh renovate

  git-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check whitespace errors
        run: ./scripts/verify-repo.sh hygiene
