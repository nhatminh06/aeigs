apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  interval: 1m
  path: ./infrastructure/gateway
  prune: true
  wait: true
  timeout: 2m
  # This directory contains Issuer and Certificate resources, so the CRDs
  # installed by the cert-manager HelmRelease have to exist before it can
  # apply at all.
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
