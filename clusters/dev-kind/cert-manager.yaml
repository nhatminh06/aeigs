apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1m
  path: ./infrastructure/cert-manager
  prune: true
  # The gateway Kustomization creates Certificates, which need these CRDs
  # to exist first. wait+timeout make that dependency real rather than a
  # race that usually resolves itself.
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
