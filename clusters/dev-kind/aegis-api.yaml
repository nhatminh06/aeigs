apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aegis-api
  namespace: flux-system
spec:
  interval: 1m
  path: ./apps/aegis-api
  prune: true
  wait: true
  timeout: 2m
  # The HTTPRoute needs the Gateway's https-api listener and the
  # ServiceMonitor needs the Prometheus CRDs, so this waits on both rather
  # than racing them.
  dependsOn:
    - name: gateway
    - name: observability
  sourceRef:
    kind: GitRepository
    name: flux-system
