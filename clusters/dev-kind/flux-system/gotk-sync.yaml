apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  # No GitHub remote exists yet for this repo. `git daemon` on the
  # developer host serves it read-only on the docker bridge; the kind
  # node reaches the host via host.docker.internal. Replace with a real
  # remote (ssh/https) and flux bootstrap once one exists.
  url: git://host.docker.internal/aegis
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  path: ./clusters/dev-kind
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
