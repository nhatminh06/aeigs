apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  # No GitHub remote exists yet for this repo. `git http-backend`
  # (CGI, via Python's http.server) serves it read-only on the
  # developer host; the kind node reaches it via host.docker.internal.
  # Replace with a real remote and `flux bootstrap` once one exists.
  url: http://host.docker.internal:8099/cgi-bin/git-http-backend/aegis
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
  labels:
    aegis.dev/reconcile-test: "pr3"
spec:
  interval: 1m
  path: ./clusters/dev-kind
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
