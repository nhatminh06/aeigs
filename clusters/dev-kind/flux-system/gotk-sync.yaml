# Initially generated by `flux bootstrap`, now intentionally maintained by
# hand: the reconcile interval and the absence of secretRef below are both
# deliberate deviations from what bootstrap generates. Rebuilds apply this
# committed file via scripts/bootstrap-flux.sh rather than regenerating it,
# so edit it here — do not run `flux bootstrap` to change it.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  # No secretRef: this repo is public, and anonymous HTTPS can already
  # read it — verified both with `git ls-remote` (credential helpers
  # disabled) and live, by removing this field from the running
  # GitRepository and confirming source-controller kept fetching
  # successfully. `flux bootstrap --token-auth` wires up a token-backed
  # secretRef by default even for a public repo; removed deliberately so
  # a compromised source-controller/flux-system namespace can't
  # exfiltrate a live GitHub token that reconciliation never actually
  # needed — see docs/decisions/0009-minimize-runtime-git-credentials.md.
  # (`flux bootstrap` would regenerate this field, which is one reason
  # reconstruction does not run it.)
  url: https://github.com/nhatminh06/aeigs.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  # flux bootstrap hardcodes 10m here; shortened for dev so config
  # experiments converge quickly.
  interval: 1m0s
  path: ./clusters/dev-kind
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
