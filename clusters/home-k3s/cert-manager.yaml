apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1m
  # Genuinely cluster-agnostic: infrastructure/cert-manager/ has no
  # dev-kind-specific values, so this points at the same path rather
  # than duplicating it — see docs/decisions/0013-home-k3s-persistent-environment.md's
  # SHARED / DEV-KIND-ONLY / HOME-K3S-ONLY breakdown.
  path: ./infrastructure/cert-manager
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
