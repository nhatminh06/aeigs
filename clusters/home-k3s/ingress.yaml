apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress
  namespace: flux-system
spec:
  interval: 1m
  path: ./infrastructure/ingress/home-k3s
  prune: true
  wait: true
  timeout: 2m
  # Certificate/Issuer need cert-manager's CRDs to exist first.
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
