apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aegis-api
  namespace: flux-system
spec:
  interval: 1m
  path: ./apps/aegis-api/home-k3s
  prune: true
  wait: true
  timeout: 2m
  # The signature policy needs to exist before the Deployment applies —
  # avoids a race where the first Pod could be admitted before Kyverno
  # has anything to check it against.
  dependsOn:
    - name: kyverno-policies
  sourceRef:
    kind: GitRepository
    name: flux-system
