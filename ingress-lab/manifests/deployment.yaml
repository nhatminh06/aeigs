# The control workload for the datapath-isolation experiment
# (docs/decisions/0014-home-k3s-gateway-blocked-by-cilium-ingress-identity-bug.md's
# addendum). An ordinary Deployment/Service, deliberately NOT going
# through Cilium's Gateway API — the question this answers is whether
# *any* proxy-to-aegis-api path works on this host, or only the
# Gateway/reserved:ingress one is broken.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-lab-proxy
  namespace: ingress-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-lab-proxy
  template:
    metadata:
      labels:
        app: ingress-lab-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: conf
          configMap:
            name: ingress-lab-proxy-conf
        - name: tmp
          emptyDir: {}
