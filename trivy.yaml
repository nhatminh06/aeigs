# Config for `trivy config .`, used identically in CI and locally so
# results never differ between the two.
scan:
  skip-dirs:
    # Deliberately-insecure fixtures for security-lab / policy tests —
    # scanning them as if they were real workloads defeats their purpose.
    - security/policies/tests
  skip-files:
    # Generated by `flux install`, marked "DO NOT EDIT" — not our code to
    # remediate; Flux's own upstream manifests. Scoped to this one
    # generated file rather than the whole flux-system directory, so the
    # files in it we DO maintain by hand (gotk-sync.yaml's GitRepository
    # and Kustomization, kustomization.yaml) still get scanned.
    - clusters/dev-kind/flux-system/gotk-components.yaml
    - clusters/home-k3s/flux-system/gotk-components.yaml
severity:
  - HIGH
  - CRITICAL
exit-code: 1
