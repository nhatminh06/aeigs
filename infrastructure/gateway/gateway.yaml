apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aegis
  namespace: gateway
spec:
  gatewayClassName: cilium
  listeners:
    # Kept alongside HTTPS rather than removed. During the TLS migration a
    # working plaintext path is what distinguishes a routing failure from a
    # trust failure; once HTTPS was proven it became the redirect source.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.aegis.test"
      allowedRoutes:
        # Routes live next to the workloads they expose, so they come from
        # other namespaces. Restricted to namespaces carrying the label
        # below rather than All, so a route cannot be attached from an
        # unrelated namespace.
        namespaces:
          from: Selector
          selector:
            matchLabels:
              aegis.dev/gateway-routes: "true"
    # One HTTPS listener per hostname, each with its own certificate. A
    # single wildcard listener would work, but it would also mean one
    # certificate for every future hostname and one blast radius for all of
    # them. certificateRefs resolve to Secrets written by cert-manager from
    # the Certificate resources in this directory.
    - name: https-grafana
      protocol: HTTPS
      port: 443
      hostname: grafana.aegis.test
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: grafana-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              aegis.dev/gateway-routes: "true"
    - name: https-auth
      protocol: HTTPS
      port: 443
      hostname: auth.aegis.test
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: auth-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              aegis.dev/gateway-routes: "true"
    - name: https-api
      protocol: HTTPS
      port: 443
      hostname: api.aegis.test
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: api-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              aegis.dev/gateway-routes: "true"
