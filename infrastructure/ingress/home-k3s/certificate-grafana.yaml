# Separate certificate from api-tls, not a shared SAN cert — same
# one-cert-per-hostname principle as dev-kind
# (infrastructure/gateway/certificate-grafana.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: ingress-system
spec:
  secretName: grafana-tls
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - grafana.aegis.home.arpa
  issuerRef:
    name: aegis-dev-ca
    kind: Issuer
    group: cert-manager.io
