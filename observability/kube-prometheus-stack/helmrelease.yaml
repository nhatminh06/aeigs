apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.3.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  values:
    # Alertmanager isn't needed yet — Prometheus + Grafana only, per the
    # current observability milestone. Revisit once alerting is scoped.
    alertmanager:
      enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: false
    prometheus:
      prometheusSpec:
        # kind is disposable; short retention avoids accumulating data
        # nobody needs past a dev session.
        retention: 6h
