apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.3.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  values:
    # Alertmanager isn't needed yet — Prometheus + Grafana only, per the
    # current observability milestone. Revisit once alerting is scoped.
    alertmanager:
      enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: false
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oidc
            key: client-secret
      "grafana.ini":
        server:
          # Browser-facing address used while testing via
          # `kubectl port-forward`; this and the Authentik provider's
          # registered redirect URI must match exactly.
          root_url: http://localhost:3000/
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: a4aabfd0c61e2e6eba4fdaeed174c158b2b6e9f6
          scopes: "openid profile email"
          # Browser-facing: only reachable while authentik-server is
          # port-forwarded to localhost:9000.
          auth_url: http://localhost:9000/application/o/authorize/
          # Backend-only calls made by Grafana's server, not the
          # browser — cluster-internal Service DNS works here.
          token_url: http://authentik-server.authentik.svc.cluster.local/application/o/token/
          api_url: http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/
        auth:
          # Local admin/password login stays available too — dev cluster,
          # don't risk locking ourselves out over OAuth.
          #
          # This belongs to [auth], not [auth.generic_oauth]. It was in the
          # OAuth section before, where Grafana ignores it as an unknown
          # key: the safeguard read as deliberate but did nothing, and
          # matched intent only because false is also Grafana's default.
          # Setting it here means changing it would actually take effect.
          disable_login_form: false
    prometheus:
      prometheusSpec:
        # kind is disposable; short retention avoids accumulating data
        # nobody needs past a dev session.
        retention: 6h
