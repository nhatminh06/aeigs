# Discovered automatically by the chart's default Grafana sidecar
# (sidecar.dashboards.enabled: true, searchNamespace: ALL) via the
# grafana_dashboard label — no dashboard-provisioning config of our
# own needed. Deliberately small: the panels this milestone's SLIs are
# actually about, not a general Kubernetes dashboard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-api-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  aegis-api.json: |
    {
      "title": "aegis-api (home-k3s)",
      "uid": "aegis-api-home-k3s",
      "timezone": "utc",
      "schemaVersion": 39,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Request rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {"expr": "sum(rate(aegis_api_http_requests_total{path=~\"/api/v1/.*\"}[5m]))", "legendFormat": "req/s"}
          ]
        },
        {
          "id": 2,
          "title": "Success ratio",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {"expr": "aegis_api:request_success_ratio:5m", "legendFormat": "success ratio"}
          ]
        },
        {
          "id": 3,
          "title": "5xx ratio",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {"expr": "aegis_api:http_5xx_ratio:5m", "legendFormat": "5xx ratio"}
          ]
        },
        {
          "id": 4,
          "title": "p95 latency",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {"expr": "aegis_api:http_request_duration_p95_seconds:5m", "legendFormat": "p95 seconds"}
          ]
        },
        {
          "id": 5,
          "title": "Prometheus target up",
          "type": "stat",
          "gridPos": {"h": 4, "w": 12, "x": 0, "y": 16},
          "targets": [
            {"expr": "up{job=\"aegis-api\"}", "legendFormat": "up"}
          ]
        }
      ]
    }
