# Deliberately NOT a copy of observability/kube-prometheus-stack/helmrelease.yaml
# (dev-kind) — home-k3s's own hostname, PVC-backed Prometheus (this is a
# persistent host and reboot-survival of telemetry is explicitly part of
# this milestone, unlike dev-kind's disposable-cluster reasoning), and a
# retention chosen for this host rather than copied. Same chart pin as
# dev-kind — already proven compatible with this Kubernetes version.
#
# OIDC wiring mirrors dev-kind's split for the same reasons
# (docs/decisions/0016-home-k3s-authentik-identity.md): auth_url is the
# browser-facing public hostname; token_url/api_url are cluster-internal
# Service DNS, made by the Grafana pod itself, avoiding a hairpin
# through the ingress and never needing the dev CA mounted here. Own
# home-k3s-specific client_id/secret, never dev-kind's.
# disable_login_form stays false — local admin fallback remains
# available so an OIDC misconfiguration can never lock the operator out.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.5.3"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  values:
    # No notification infrastructure in this milestone — Prometheus's own
    # rule evaluation (alerts inactive/active in its API) is enough to
    # prove the SLO rules work.
    alertmanager:
      enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      # No PVC: dashboards/config are Git-provisioned, and there is no
      # other mutable Grafana state worth surviving a Pod restart.
      persistence:
        enabled: false
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oidc
            key: client-secret
      "grafana.ini":
        server:
          # Grafana builds the OAuth redirect_uri from this, so it must
          # match the Authentik provider's registered redirect URI
          # exactly, including the scheme AND the port. home-k3s's
          # ingress is exposed on a NodePort (30443), not the browser's
          # implicit 443 — omitting the port here sends the browser to
          # a listener that doesn't exist and the OAuth flow hangs
          # (observed live: "sign in" spins forever). Fixed by making
          # every hostname reference below explicit about the port.
          root_url: https://grafana.aegis.home.arpa:30443/
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: bf212636c078e13940374b77f00a0e0f64f0a397
          scopes: "openid profile email"
          # Browser-facing: the user's browser is redirected here.
          auth_url: https://auth.aegis.home.arpa:30443/application/o/authorize/
          # Backend-only calls made by Grafana's server — cluster-internal
          # Service DNS, not the public hostname. See the header comment.
          token_url: http://authentik-server.authentik.svc.cluster.local/application/o/token/
          api_url: http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/
        auth:
          # Local admin/password login stays available — recovery
          # safeguard, not a permanent parallel path.
          disable_login_form: false
    prometheus:
      prometheusSpec:
        # Persistent host, so a small PVC is justified (see the ADR) —
        # unlike dev-kind's disposable-cluster reasoning. 24h: enough to
        # see a reboot's data gap and a day of real history without
        # meaningfully touching CachyOS's disk (95G free at the time
        # this was chosen).
        retention: 24h
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
        # Observed live: the operator's default probes (liveness
        # timeoutSeconds=3, failureThreshold=6 -> ~30s budget) were too
        # tight for this host — a real, sustained crash loop (17
        # restarts, hundreds of readiness failures over several hours)
        # where WAL-replay CPU contention on a 12-core laptop competing
        # with the rest of the platform meant Prometheus couldn't answer
        # its own HTTP health check in time, got killed, and had to
        # replay the WAL again on the next attempt — a self-perpetuating
        # loop, not a one-off blip. `containers:` here strategic-merges
        # into the operator-generated container spec by name (verified
        # via `helm template` against the rendered Prometheus CR before
        # applying), not a raw pod-spec hack.
        containers:
          - name: prometheus
            livenessProbe:
              httpGet:
                path: /-/healthy
                port: http-web
              initialDelaySeconds: 30
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 6
            readinessProbe:
              httpGet:
                path: /-/ready
                port: http-web
              initialDelaySeconds: 10
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 6
    prometheusOperator:
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
    kubeStateMetrics:
      enabled: true
    nodeExporter:
      enabled: true
    # Not chased in this milestone — a single-node K3s control plane's
    # own scrape targets (etcd, scheduler, etc.) aren't exposed the same
    # way a kubeadm cluster's are, and getting every one green isn't the
    # point here.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
